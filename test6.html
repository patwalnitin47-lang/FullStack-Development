<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Spider-Man Villains</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    font-family:'Oswald',sans-serif;
    background:#000;
}

/* Low opacity Spider-Man background */

body::before{
    content:"";
    position:fixed;
    inset:0;

    background:url("images/spiderman.png") center/cover no-repeat;
    opacity:.12;

    z-index:-1;
}

/* Horizontal container */

.container{
    display:flex;

    width:100vw;
    height:100vh;

    overflow-x:auto;
    overflow-y:hidden;

    scroll-snap-type:x mandatory;
    scroll-behavior:smooth;
}

/* Hide scrollbar */

.container::-webkit-scrollbar{
    display:none;
}

.container{
    scrollbar-width:none;
    display:inline-flex;
    width:90vw;
    height:100vh;
    

}

/* Cards */

.card{

    min-width:100vw;
    height:100vh;

    position:relative;

    scroll-snap-align:start;

    display:flex;
    justify-content:center;
    align-items:center;
}

.card img{

    width:90%;
    height:90%;

    object-fit:cover;

    border-radius:20px;

    box-shadow:0 20px 50px rgba(0,0,0,.6);
}

/* Dark overlay */

.card::after{

    content:"";

    position:absolute;
    left:5%;
    top:5%;

    width:90%;
    height:90%;

    border-radius:20px;

    background:linear-gradient(
        to top,
        rgba(0,0,0,.8),
        rgba(0,0,0,.1),
        transparent
    );
}

/* Villain Name */

.card h1{

    position:absolute;

    left:8%;
    bottom:10%;

    color:white;

    font-size:70px;

    text-shadow:0 0 20px black;

    z-index:2;
}

/* Heading */

.heading{

    position:fixed;

    top:20px;
    left:50%;

    transform:translateX(-50%);

    color:white;

    font-size:55px;

    z-index:100;

    text-shadow:0 0 20px red;
}

</style>

</head>

<body>

<div class="heading">
Spider-Man Villains
</div>

<div class="container">

    <section class="card">
        <img src="images (4).jpg" alt="Green Goblin">
        <h1>Green Goblin</h1>
    </section>

    <section class="card">
        <img src="images (1).jpg" alt="Doctor Octopus">
        <h1>Doctor Octopus</h1>
    </section>

    <section class="card">
        <img src="images (3).jpg" alt="Venom">
        <h1>Venom</h1>
    </section>

    <section class="card">
        <img src="images (2).jpg" alt="Sandman">
        <h1>Sandman</h1>
    </section>

    <section class="card">
        <img src="images.jpg" alt="Mysterio">
        <h1>Mysterio</h1>
    </section>

</div>

</body>
</html>
