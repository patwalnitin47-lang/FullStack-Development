<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0
">
    <title>Document</title>
    <style>
.container{
    display:flex;
    /* justify-content:center; */
    height:90vh;
    outline:3px solid black;
    flex-direction:row;
    align-items:center;
    flex-wrap:wrap;
    
}

.container>div{
    background-color: black;
    color:white;
    height:100px;
    align-content:center;
    text-align:center;
    text-shadow:black;
    width:150px;

}

#box1{
    flex-basis:150px;
    background-color:red;
    flex-grow:0;
    flex-shrink:0;
    flex-wrap:wrap;
}
#box2{
    flex-basis:150px;
    background-color:rgb(1, 119, 30);
    flex-grow:0;
    flex-shrink:0;
}
#box3{
    flex-basis:150px;
    flex-grow:0;
    flex-shrink:0;
}
#box4{
    flex-basis:150px;
    flex-grow:0;
    flex-shrink:0;
    background-color:rgb(233, 49, 92);
}
#box5{
    background-color:sandybrown;
}
#box6{
    background-color:rgb(1, 119, 30);
}


    </style>
    </head>
    <body>
        
        <div class="container">
            <div id="box1">1</div>
            <div id="box2">2</div>
            <div id="box3">3</div>
            <div id="box4">4</div>
            <div id="box5">5</div>
            <div id="box6">6</div>
        </div>

    </body>
    </html>
</html>
