<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0
">
    <title>Login card</title>
    <style>
        .login{
            display:flex;
            justify-content:center;
            align-items:center;
            flex-direction:column;

        }
        .login>div{
            height:300px;
            width:300px;
            background-color:rgb(15, 1, 95);
            justify-content:center;
            border-radius:9px;
            align-items:center;
        }
        h1{
            text-align:center;
            color:white;
        }
        input{
            width:90%;
            height:35px;
            border-radius:5px;
            justify-content:center;
            align-items:center;
            text-align:center;
        }
        button{
            width:90%;
            height:30px;
            border-radius:5px;
            justify-content:center;
            color:white;
            background-color:rgb(0, 0, 0);
            text-align:center;
        }
        .container input {
            width: 100%;
            margin: 15px 0;
    }

    </style>
    </head>
    <body>
        <div class="login">
            <div class="login-card">
                <h1>Login</h1>
                <form>
                    <input type="text" placeholder="Username" required></br></br>
                    <input type="password" placeholder="Password" required></br></br>
                    <button type="submit">Login</button>
                </form>
        </div>
    </body>
