<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spider-Man Villains</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap"
        rel="stylesheet">

    <style>

        body {
            margin: 0;
            background-color: rgb(3, 3, 3);
            font-family: Arial, sans-serif;
        }

        .heading {
            text-align: center;
            font-size: 80px;
            font-weight: bold;
            font-family: 'Oswald', sans-serif;
            color: white;
            background-color: black;
            padding: 20px;
            margin: 0;
            text-shadow: 0px 0px 20px red;
        }

        .box {
            width: 500px;
            height: 200px;

            color: white;
            font-size: 24px;
            font-weight: bold;

            position: sticky;
            top: 10px;

            display: flex;
            align-items: center;
            justify-content: space-around;

            margin: 20px auto;
            border-radius: 15px;
            overflow: hidden;
        }

        .box img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
        }

        .box p {
            margin: 0;
        }

        #box1 {
            background-color: red;
        }

        #box2 {
            background-color: blue;
        }

        #box3 {
            background-color: green;
        }

        #box4 {
            background-color: yellow;
            color: black;
        }

        #box5 {
            background-color: purple;
        }

    </style>
</head>

<body>

    <div class="heading">
        Spider-Man Villains
    </div>

    <div class="box" id="box1">
        <p>Green Goblin</p>
        <img src="images/goblin.webp" alt="Green Goblin">
    </div>

    <div class="box" id="box2">
        <p>Doctor Octopus</p>
        <img src=images (1).jpg>
    </div>

    <div class="box" id="box3">
        <p>Venom</p>
        <img src="images/venom.webp" alt="Venom">
    </div>

    <div class="box" id="box4">
        <p>Sandman</p>
        <img src="images/sandman.webp" alt="Sandman">
    </div>

    <div class="box" id="box5">
        <p>Mysterio</p>
        <img src="images/mysterio.webp" alt="Mysterio">
    </div>

</body>

</html>
