<!DOCTYPE html>
<html>
<head>
<title>Page Title</title>
<style>
    section h2{
        color: aqua;
    }
    section>h2{
        color:blue;
    }
    h2~p{
        color: green;
        font-size: 40px;
    }
    h2+p{
        font-size: larger;
        color: yellow;
        text-shadow: 1px 1px 1px black;
    }
    
</style>
</head>
<body>

    <section>
        <h2>Heading 1</h2>
        <p>Para 1</p>
        <p>Para 2</p>
        <div>
            <h2>Heading 2</h2>
        </div>
    </section>

</body>
</html>
