<!DOCTYPE html>
<html>
    <head>
        <title>

        </title>
        <style>
            .container{
                display:grid;
                grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
                /* grid-template-rows:repeat(4,1fr); */
                grid-template-areas:"box1 box1 box2"
                                    "box3 box4 box5"
                                    "box7 box6 box5";
                outline:2px solid black;
                background: black;
                padding: 5px;
                justify-content:center;
            }
            .container>div{
                outline: 1px solid black;
                font-size:30px;
            }
            .box1{
                font-size:50px;
                background-color:beige;
                color:rgb(3, 82, 34);
                justify-content:center;
                text-align:center;
                font-weight:bolder;
                border-radius:15px;
            }
            .box3,.box2{
                font-size:50px;
                background-color:beige;
                color:rgb(253, 3, 3);
                justify-content:center;
                text-align:center;
                font-weight:bolder;
                border-radius:15px;
            }
            .box4, .box5,.box6,.box7{
                background-color:beige;
                color:rgb(60, 14, 124);
                font-weight:bolder;
                text-align:center;
                border-radius:15px;
            }
            .container2{
                display:grid;
                grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
                /* grid-template-rows:repeat(4,1fr); */
                outline :1px solid black;
            }
            .container2>div{
                outline: 1px dashed black;
                font-size:30px;

            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="box1" style="grid-area:box1;">Better <br>now closer</div>
            <div class="box2" style="grid-area:box2;"><img src="images ().jpg" alt="Image"></div>
            <div class="box3" style="grid-area:box3;"><br>Team Adaptation<br></div>
            <div class="box4" style="grid-area:box4;">SYNC<br></div>
            <div class="box5" style="grid-area:box5;">Section 5</div>
            <div class="box6" style="grid-area:box6;">Section 6</div>
            <div class="box7" style="grid-area:box7;">Section 7</div>
        </div><br>
        <!-- <div class="container2">
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div>4</div>
            <div>5</div>
        </div> -->
    </body>
</html>
